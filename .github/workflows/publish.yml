name: Refresh publications and deploy website
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bibliography merge behavior
        run: python scripts/test_publications.py
      - name: Install Scholar client
        if: github.event_name != 'push'
        run: python -m pip install scholarly==1.7.11
      - name: Refresh Google Scholar snapshot
        id: scholar
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/update_publications.py
      - name: Report refresh failure
        if: steps.scholar.outcome == 'failure'
        run: echo '::warning::Scholar refresh failed. Deploying the last verified bibliography unchanged.'
      - name: Save successful refresh
        if: steps.scholar.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/publications.json
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh publication bibliography'
            git push
          fi
      - name: Build static website
        run: python scripts/build.py
      - name: Validate generated pages
        run: python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
